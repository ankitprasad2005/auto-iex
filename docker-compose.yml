services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DAM_SCRAPE_HOUR: ${DAM_SCRAPE_HOUR}
    depends_on:
      - db
    # No ports: published — unreachable from the host. Only the frontend's
    # nginx reverse proxy can reach it, via service-name DNS (http://backend:8000).

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      # Restricts the base image's envsubst to this one variable, so nginx's
      # own $uri/$host/$remote_addr in nginx.conf.template aren't clobbered
      # (envsubst with no filter replaces every $-prefixed token it can
      # find an env var for, and empties the rest).
      NGINX_ENVSUBST_FILTER: "^BACKEND_URL$$"
    depends_on:
      - backend
    ports:
      # Host-side port omitted on purpose: Docker publishes container port
      # 80 to a random free host port. Find it with `docker compose port
      # frontend 80` or `docker compose ps`.
      - "80"

volumes:
  db_data:
